<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>說書小宇宙 - AI 伴讀趣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue-50 font-sans min-h-screen flex flex-col overflow-x-hidden">
    
    <!-- Navbar -->
    <nav class="bg-gradient-to-r from-purple-500 to-indigo-600 shadow-lg text-white p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-book-open-reader text-yellow-300"></i>
                說書小宇宙
            </h1>
            
            <div id="auth-section">
                <!-- 未登入狀態 -->
                <button id="login-btn" class="bg-white text-indigo-600 font-bold py-2 px-6 rounded-full shadow hover:bg-yellow-100 transition-colors flex items-center gap-2 transform hover:scale-105 active:scale-95 duration-200">
                    <i class="fa-brands fa-google"></i>
                    使用 Google 帳號登入
                </button>
                
                <!-- 已登入狀態 -->
                <div id="user-profile" class="hidden flex items-center gap-3">
                    <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Felix" alt="User Avatar" class="w-10 h-10 rounded-full bg-white border-2 border-yellow-300" id="user-avatar">
                    <div class="hidden sm:block text-sm">
                        <p class="font-bold">你好，同學！</p>
                        <p class="text-indigo-200 text-xs">已連線至 Gemini AI</p>
                    </div>
                    <button id="logout-btn" class="text-sm bg-indigo-700 hover:bg-indigo-800 p-2 rounded-full transition-colors" title="登出">
                        <i class="fa-solid fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto flex-grow p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 relative">
        
        <!-- 未登入遮罩 -->
        <div id="login-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-40 flex flex-col items-center justify-center rounded-xl m-4">
            <i class="fa-solid fa-lock text-6xl text-indigo-300 mb-4 animate-bounce"></i>
            <h2 class="text-2xl font-bold text-gray-700 mb-2">登入以解鎖所有功能</h2>
            <p class="text-gray-500 mb-6 text-center px-4">請使用上方的登入按鈕連線至 Gemini AI，開始你的說書旅程！</p>
        </div>

        <!-- Left Column: Video Player -->
        <section class="flex flex-col gap-4">
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col border-t-4 border-yellow-400">
                <div class="bg-yellow-50 p-3 border-b border-yellow-100 flex justify-between items-center">
                    <h2 class="font-bold text-yellow-800 flex items-center gap-2 text-lg">
                        <i class="fa-brands fa-youtube text-red-500"></i>
                        說書精選清單
                    </h2>
                </div>
                <!-- YouTube Iframe -->
                <div class="aspect-video w-full bg-black relative" id="player-container">
                    <div id="player"></div>
                </div>
                <div class="p-4 bg-gray-50">
                    <p class="text-sm text-gray-600 mb-2">💡 點擊影片右上角的選單按鈕可以切換清單中的其他影片喔！</p>
                    <button id="record-video-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-4 rounded-xl shadow transition-colors flex justify-center items-center gap-2">
                        <i class="fa-solid fa-check-circle"></i>
                        我已經看完這部影片了
                    </button>
                </div>
            </div>

            <!-- Learning History -->
            <div class="bg-white rounded-2xl shadow-xl p-4 flex flex-col h-full border-t-4 border-emerald-400">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-emerald-800 flex items-center gap-2 text-lg">
                        <i class="fa-solid fa-medal text-yellow-500"></i>
                        我的學習歷程
                    </h2>
                    <button id="download-history-btn" class="text-emerald-600 hover:text-emerald-800 text-sm font-bold flex items-center gap-1 p-2 bg-emerald-50 rounded-lg transition-colors">
                        <i class="fa-solid fa-download"></i>
                        下載歷程
                    </button>
                </div>
                <div id="history-list" class="flex-grow overflow-y-auto max-h-40 space-y-2 text-sm text-gray-700 p-2 bg-gray-50 rounded-lg border border-gray-100">
                    <!-- History items will go here -->
                    <p class="text-gray-400 italic text-center py-4" id="empty-history-msg">尚未有紀錄，開始看影片和發問吧！</p>
                </div>
            </div>
        </section>

        <!-- Right Column: AI Chat -->
        <section class="bg-white rounded-2xl shadow-xl flex flex-col h-[80vh] lg:h-auto border-t-4 border-purple-500">
            <div class="bg-purple-50 p-3 border-b border-purple-100 flex justify-between items-center">
                <h2 class="font-bold text-purple-800 flex items-center gap-2 text-lg">
                    <i class="fa-solid fa-robot text-purple-600"></i>
                    AI 伴讀小助手
                </h2>
                <button id="download-word-btn" class="text-purple-600 hover:text-purple-800 text-sm font-bold flex items-center gap-1 p-2 bg-purple-100 rounded-lg transition-colors" title="將對話下載為 Word 報告">
                    <i class="fa-solid fa-file-word"></i>
                    匯出 Word
                </button>
            </div>
            
            <!-- Chat Area -->
            <div id="chat-box" class="flex-grow p-4 overflow-y-auto flex flex-col gap-4 bg-gray-50">
                <!-- Welcome Message -->
                <div class="flex gap-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-400 to-indigo-500 flex items-center justify-center text-white flex-shrink-0 shadow">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm text-gray-700 text-[16px] max-w-[85%] leading-relaxed border border-gray-100">
                        哈囉！我是你的 AI 伴讀小助手 👋<br>
                        關於剛才看過的影片，有什麼心得或是想問的問題嗎？不管是書裡的劇情、作者背景，還是想討論人生哲理，都可以問我喔！✨
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 bg-white border-t border-gray-100 rounded-b-2xl">
                <form id="chat-form" class="flex gap-2">
                    <input type="text" id="chat-input" class="flex-grow bg-gray-100 border border-gray-200 text-gray-800 text-[16px] rounded-full px-5 py-3 focus:outline-none focus:ring-2 focus:ring-purple-400 transition-all shadow-inner" placeholder="輸入你想問的問題..." autocomplete="off">
                    <button type="submit" id="send-btn" class="bg-purple-600 hover:bg-purple-700 text-white rounded-full w-12 h-12 flex items-center justify-center flex-shrink-0 shadow-lg transform hover:scale-105 active:scale-95 transition-all">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- 音效資源 -->
    <audio id="sound-click" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b820a665.mp3?filename=click-button-140881.mp3" preload="auto"></audio>
    <audio id="sound-receive" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=success-1-6297.mp3" preload="auto"></audio>
    <audio id="sound-achievement" src="https://cdn.pixabay.com/download/audio/2021/08/09/audio_82c5f105bb.mp3?filename=level-up-191997.mp3" preload="auto"></audio>

    <!-- Scripts -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
</body>
</html>
